
name: Build Pult IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Show Xcode and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project Pult.xcodeproj

      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild \
            -project Pult.xcodeproj \
            -scheme "Pult Release Direct" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Pult.app"
          test -d "$APP"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qr Pult.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pult-unsigned-IPA
          path: build/Pult.ipa
          if-no-files-found: error
